<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><!-- 字型 fallback：PingFang TC、Noto Sans TC、Microsoft JhengHei；只在 macOS Chromium 驗過版面 --><title id="t">一句話經過幾手：AWS 運算資源『賣到 2028』</title><desc id="d">由左到右的傳話鏈，共四個節點：「Andy Jassy（私下對話）」 → 「Ben Horowitz 在 All-In 節目轉述：beyond 2028」 → 「主持人在本訪談轉述：運算資源到 2028 年前都賣光了（18:57）」 → 「Pichai 回應：這很合理；客戶如果今天才來要 2027 年的運算資源，很難接；去年也向外租了短期運算資源（19:07–19:31）」。前兩個節點標「單方說法」。下方對照框標「已確認」：「Jassy 本人公開說法（a16z 節目，2026-10-23 美國時間，Reuters 報導）：2027 年 largely sold out，保留一部分給 on-demand、Bedrock、EC2；2028 年 a good chunk 已售出」。時間標註：「Pichai 的訪談早於 Jassy 這次公開發言」。對照框以虛線連回第一個節點（同一人 Jassy）。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5a54"/></marker></defs><rect width="900" height="600" fill="#f9f7f4"/><text font-size="26" fill="#2b2b2b" text-anchor="start" font-weight="700"><tspan x="30.0" y="47.4">一句話經過幾手：AWS 運算資源『賣到 2028』</tspan></text><rect id="b45" x="181.0" y="71.1" width="102.0" height="33.6" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.5" rx="16.8"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b45"><tspan x="192.0" y="94.7">單方說法</tspan></text><path d="M36.0,122.7 L36.0,112.7 L428.0,112.7 L428.0,122.7" fill="none" stroke="#d6a65c" stroke-width="2" stroke-linejoin="round"/><rect id="b46" x="30.0" y="132.7" width="186.0" height="226.0" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.8" rx="12"/><text font-size="18" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b46"><tspan x="44.0" y="164.9">Andy Jassy（私下</tspan><tspan x="44.0" y="189.8">對話）</tspan></text><rect id="b47" x="248.0" y="132.7" width="186.0" height="226.0" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.8" rx="12"/><text font-size="18" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b47"><tspan x="262.0" y="164.9">Ben Horowitz 在 </tspan><tspan x="262.0" y="189.8">All-In 節目轉</tspan><tspan x="262.0" y="214.6">述：beyond 2028</tspan></text><rect id="b48" x="466.0" y="132.7" width="186.0" height="226.0" fill="#f7dde2" stroke="#d48b9b" stroke-width="1.8" rx="12"/><text font-size="18" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b48"><tspan x="480.0" y="164.9">主持人在本訪談轉</tspan><tspan x="480.0" y="189.8">述：運算資源到 </tspan><tspan x="480.0" y="214.6">2028 年前都賣光了</tspan><tspan x="480.0" y="239.4">（18:57）</tspan></text><rect id="b49" x="684.0" y="132.7" width="186.0" height="226.0" fill="#dce8f6" stroke="#7fa3cf" stroke-width="1.8" rx="12"/><text font-size="18" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b49"><tspan x="698.0" y="164.9">Pichai 回應：</tspan><tspan x="698.0" y="189.8">這很合理；客戶如</tspan><tspan x="698.0" y="214.6">果今天才來要 2027 </tspan><tspan x="698.0" y="239.4">年的運算資源，</tspan><tspan x="698.0" y="264.3">很難接；去年也向</tspan><tspan x="698.0" y="289.1">外租了短期運算資</tspan><tspan x="698.0" y="314.0">源</tspan><tspan x="698.0" y="338.8">（19:07–19:31）</tspan></text><path d="M219.0,245.7 L244.0,245.7" fill="none" stroke="#5f5a54" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M437.0,245.7 L462.0,245.7" fill="none" stroke="#5f5a54" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M655.0,245.7 L680.0,245.7" fill="none" stroke="#5f5a54" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-size="20" fill="#5f5a54" text-anchor="end" font-weight="700"><tspan x="870.0" y="394.8">Pichai 的訪談早於 Jassy 這次公開發言</tspan></text><rect id="b50" x="30.0" y="417.2" width="840.0" height="159.2" fill="#ddefe3" stroke="#7cb394" stroke-width="1.8" rx="14"/><rect id="b51" x="48.0" y="433.2" width="82.0" height="33.6" fill="#c9e6d3" stroke="#7cb394" stroke-width="1.5" rx="16.8"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b51 b50"><tspan x="59.0" y="456.8">已確認</tspan></text><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b50"><tspan x="48.0" y="496.8">Jassy 本人公開說法（a16z 節目，2026-10-23 美國時間，Reuters 報導）：2027 年 </tspan><tspan x="48.0" y="524.4">largely sold out，保留一部分給 on-demand、Bedrock、EC2；2028 年 a good chunk </tspan><tspan x="48.0" y="552.0">已售出</tspan></text><path d="M123.0,360.8 L123.0,413.2" fill="none" stroke="#7cb394" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/></svg>