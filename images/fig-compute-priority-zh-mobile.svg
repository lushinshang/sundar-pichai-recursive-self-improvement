<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 815" width="600" height="815" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><!-- 字型 fallback：PingFang TC、Noto Sans TC、Microsoft JhengHei；只在 macOS Chromium 驗過版面 --><title id="t">Pichai 描述的運算資源配置先後</title><desc id="d">由上而下兩層的配置先後圖。第 1 層「Google DeepMind：研究與前沿模型開發」，旁註「不可妥協（Pichai 自述，17:15–18:35）」。實線箭頭往下到第 2 層「各事業依長遠計畫規劃」，其中有兩個小方框「Cloud（預測、需求訊號、已簽約合約）」與「其他事業」。一條虛線箭頭從第 1 層指向 Cloud，標註「Cloud 隨時在放棄短期營收（Pichai 自述；財報未量化、未揭露配比）」。流程外的旁註：「供給不夠時：去年向外租用短期運算資源，配合部分客戶（Pichai 自述）」。底部說明條：「財報可查的部分：2026 年第一季 Pichai 說能滿足需求的話 Cloud 營收會更高；第二季 CFO 說仍處於供給受限環境」。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5a54"/></marker></defs><rect width="600" height="815" fill="#f9f7f4"/><text font-size="28" fill="#2b2b2b" text-anchor="start" font-weight="700"><tspan x="24.0" y="49.2">Pichai 描述的運算資源配置先後</tspan></text><rect id="b38" x="60.0" y="77.4" width="516.0" height="101.0" fill="#dce8f6" stroke="#7fa3cf" stroke-width="1.8" rx="12"/><text font-size="26" fill="#2b2b2b" text-anchor="middle" font-weight="700" data-box="b38"><tspan x="318.0" y="118.8">Google DeepMind：</tspan><tspan x="318.0" y="154.6">研究與前沿模型開發</tspan></text><rect id="b39" x="60.0" y="190.4" width="486.5" height="40.3" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.5" rx="20.160000000000004"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b39"><tspan x="73.2" y="218.7">不可妥協（Pichai 自述，17:15–18:35）</tspan></text><path d="M90.0,178.4 L90.0,190.4" fill="none" stroke="#d6a65c" stroke-width="1.5" stroke-linejoin="round"/><text font-size="24" fill="#5f5a54" text-anchor="start" font-weight="400"><tspan x="74.0" y="268.3">Cloud 隨時在放棄短期營收（Pichai </tspan><tspan x="74.0" y="301.4">自述；財報未量化、未揭露配比）</tspan></text><path d="M526.0,236.7 L526.0,326.7" fill="none" stroke="#5f5a54" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b40" x="60.0" y="328.7" width="516.0" height="200.9" fill="#f3f1ec" stroke="#5f5a54" stroke-width="1.8" rx="14"/><text font-size="26" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b40"><tspan x="78.0" y="370.1">各事業依長遠計畫規劃</tspan></text><rect id="b41" x="78.0" y="389.8" width="480.0" height="54.9" fill="#ddefe3" stroke="#7cb394" stroke-width="1.8" rx="12"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b41 b40"><tspan x="92.0" y="425.4">Cloud（預測、需求訊號、已簽約合約）</tspan></text><rect id="b42" x="78.0" y="456.7" width="480.0" height="54.9" fill="#e6e9ee" stroke="#9eaab7" stroke-width="1.8" rx="12"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b42 b40"><tspan x="92.0" y="492.3">其他事業</tspan></text><path d="M60.0,127.9 L36.0,127.9 L36.0,417.2 L76.0,417.2" fill="none" stroke="#5f5a54" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect id="b43" x="24.0" y="551.6" width="552.0" height="92.0" fill="#e9e2f4" stroke="#a08cc8" stroke-width="1.8" rx="12" stroke-dasharray="6 5"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b43"><tspan x="40.0" y="589.2">供給不夠時：去年向外租用短期運算資源，</tspan><tspan x="40.0" y="622.3">配合部分客戶（Pichai 自述）</tspan></text><rect id="b44" x="24.0" y="665.6" width="552.0" height="125.1" fill="#e6e9ee" stroke="#9eaab7" stroke-width="1.8" rx="12"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b44"><tspan x="40.0" y="703.2">財報可查的部分：2026 年第一季 Pichai </tspan><tspan x="40.0" y="736.3">說能滿足需求的話 Cloud 營收會更高；第二季 </tspan><tspan x="40.0" y="769.4">CFO 說仍處於供給受限環境</tspan></text></svg>