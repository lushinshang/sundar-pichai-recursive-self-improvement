<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1267" width="600" height="1267" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><!-- 字型 fallback：PingFang TC、Noto Sans TC、Microsoft JhengHei；只在 macOS Chromium 驗過版面 --><title id="t">Pichai 描述的常駐 agent：三層加脈絡</title><desc id="d">左側是四層堆疊，由下而上：模型（Argon）、harness、執行環境（runtime）、你的脈絡；外框標「無介面服務（headless service），在雲端全天候運行」。右側依發布狀態分三組：「已發表」：企業版 Gemini agent（2026-10-08）、Agent Compute Engine：每個 agent 一個 microVM（2026-10-22）、Gemini Spark（2026-05-19）；「Pichai 自述」：Pro、Ultra 使用者在 Gemini app 已看到對話與任務、每個查詢啟動一個 micro VM、agentic 任務比例穩定成長（未公布數字）；「計畫」：把統一 agent 帶給消費者、個人 agent 跨 Gemini app、Google 搜尋、Gmail，由 Argon 驅動。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5a54"/></marker></defs><rect width="600" height="1267" fill="#f9f7f4"/><text font-size="28" fill="#2b2b2b" text-anchor="start" font-weight="700"><tspan x="24.0" y="49.2">Pichai 描述的常駐 agent：三層加脈絡</tspan></text><rect id="b85" x="24.0" y="75.4" width="552.0" height="394.0" fill="#f1eee8" stroke="#5f5a54" stroke-width="1.8" rx="16" stroke-dasharray="7 5"/><text font-size="24" fill="#5f5a54" text-anchor="start" font-weight="700" data-box="b85"><tspan x="42.0" y="113.0">無介面服務（headless service），</tspan><tspan x="42.0" y="146.1">在雲端全天候運行</tspan></text><rect id="b86" x="42.0" y="165.4" width="516.0" height="64.0" fill="#f7dde2" stroke="#d48b9b" stroke-width="1.8" rx="12"/><text font-size="26" fill="#2b2b2b" text-anchor="middle" font-weight="700" data-box="b86 b85"><tspan x="300.0" y="206.2">你的脈絡</tspan></text><rect id="b87" x="42.0" y="239.4" width="516.0" height="64.0" fill="#dce8f6" stroke="#7fa3cf" stroke-width="1.8" rx="12"/><text font-size="26" fill="#2b2b2b" text-anchor="middle" font-weight="700" data-box="b87 b85"><tspan x="300.0" y="280.2">執行環境（runtime）</tspan></text><rect id="b88" x="42.0" y="313.4" width="516.0" height="64.0" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.8" rx="12"/><text font-size="26" fill="#2b2b2b" text-anchor="middle" font-weight="700" data-box="b88 b85"><tspan x="300.0" y="354.2">harness</tspan></text><rect id="b89" x="42.0" y="387.4" width="516.0" height="64.0" fill="#ddefe3" stroke="#7cb394" stroke-width="1.8" rx="12"/><text font-size="26" fill="#2b2b2b" text-anchor="middle" font-weight="700" data-box="b89 b85"><tspan x="300.0" y="428.2">模型（Argon）</tspan></text><rect id="b90" x="24.0" y="495.4" width="98.4" height="40.3" fill="#ddefe3" stroke="#7cb394" stroke-width="1.5" rx="20.160000000000004"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b90"><tspan x="37.2" y="523.7">已發表</tspan></text><rect id="b91" x="24.0" y="545.7" width="552.0" height="50.9" fill="#fffdf9" stroke="#7cb394" stroke-width="1.8" rx="10"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b91"><tspan x="36.0" y="579.3">企業版 Gemini agent（2026-10-08）</tspan></text><rect id="b92" x="24.0" y="604.6" width="552.0" height="84.0" fill="#fffdf9" stroke="#7cb394" stroke-width="1.8" rx="10"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b92"><tspan x="36.0" y="638.2">Agent Compute Engine：每個 agent 一個 </tspan><tspan x="36.0" y="671.3">microVM（2026-10-22）</tspan></text><rect id="b93" x="24.0" y="696.6" width="552.0" height="50.9" fill="#fffdf9" stroke="#7cb394" stroke-width="1.8" rx="10"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b93"><tspan x="36.0" y="730.2">Gemini Spark（2026-05-19）</tspan></text><rect id="b94" x="24.0" y="771.4" width="164.9" height="40.3" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.5" rx="20.160000000000004"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b94"><tspan x="37.2" y="799.8">Pichai 自述</tspan></text><rect id="b95" x="24.0" y="821.8" width="552.0" height="84.0" fill="#fffdf9" stroke="#d6a65c" stroke-width="1.8" rx="10"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b95"><tspan x="36.0" y="855.4">Pro、Ultra 使用者在 Gemini app </tspan><tspan x="36.0" y="888.5">已看到對話與任務</tspan></text><rect id="b96" x="24.0" y="913.8" width="552.0" height="50.9" fill="#fffdf9" stroke="#d6a65c" stroke-width="1.8" rx="10"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b96"><tspan x="36.0" y="947.4">每個查詢啟動一個 micro VM</tspan></text><rect id="b97" x="24.0" y="972.6" width="552.0" height="50.9" fill="#fffdf9" stroke="#d6a65c" stroke-width="1.8" rx="10"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b97"><tspan x="36.0" y="1006.2">agentic 任務比例穩定成長（未公布數字）</tspan></text><rect id="b98" x="24.0" y="1047.5" width="74.4" height="40.3" fill="#e9e2f4" stroke="#a08cc8" stroke-width="1.5" rx="20.160000000000004"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b98"><tspan x="37.2" y="1075.8">計畫</tspan></text><rect id="b99" x="24.0" y="1097.8" width="552.0" height="50.9" fill="#fffdf9" stroke="#a08cc8" stroke-width="1.8" rx="10"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b99"><tspan x="36.0" y="1131.4">把統一 agent 帶給消費者</tspan></text><rect id="b100" x="24.0" y="1156.7" width="552.0" height="84.0" fill="#fffdf9" stroke="#a08cc8" stroke-width="1.8" rx="10"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b100"><tspan x="36.0" y="1190.3">個人 agent 跨 Gemini app、Google 搜尋、</tspan><tspan x="36.0" y="1223.4">Gmail，由 Argon 驅動</tspan></text></svg>