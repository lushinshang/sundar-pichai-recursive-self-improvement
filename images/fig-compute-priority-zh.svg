<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" width="900" height="504" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><!-- 字型 fallback：PingFang TC、Noto Sans TC、Microsoft JhengHei；只在 macOS Chromium 驗過版面 --><title id="t">Pichai 描述的運算資源配置先後</title><desc id="d">由上而下兩層的配置先後圖。第 1 層「Google DeepMind：研究與前沿模型開發」，旁註「不可妥協（Pichai 自述，17:15–18:35）」。實線箭頭往下到第 2 層「各事業依長遠計畫規劃」，其中有兩個小方框「Cloud（預測、需求訊號、已簽約合約）」與「其他事業」。一條虛線箭頭從第 1 層指向 Cloud，標註「Cloud 隨時在放棄短期營收（Pichai 自述；財報未量化、未揭露配比）」。流程外的旁註：「供給不夠時：去年向外租用短期運算資源，配合部分客戶（Pichai 自述）」。底部說明條：「財報可查的部分：2026 年第一季 Pichai 說能滿足需求的話 Cloud 營收會更高；第二季 CFO 說仍處於供給受限環境」。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5a54"/></marker></defs><rect width="900" height="504" fill="#f9f7f4"/><text font-size="26" fill="#2b2b2b" text-anchor="start" font-weight="700"><tspan x="30.0" y="47.4">Pichai 描述的運算資源配置先後</tspan></text><rect id="b31" x="62.0" y="75.1" width="470.0" height="60.6" fill="#dce8f6" stroke="#7fa3cf" stroke-width="1.8" rx="12"/><text font-size="22" fill="#2b2b2b" text-anchor="middle" font-weight="700" data-box="b31"><tspan x="297.0" y="112.9">Google DeepMind：研究與前沿模型開發</tspan></text><rect id="b32" x="562.0" y="68.4" width="308.0" height="74.0" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.5" rx="12"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b32"><tspan x="578.0" y="98.4">不可妥協（Pichai 自述，</tspan><tspan x="578.0" y="126.0">17:15–18:35）</tspan></text><path d="M532.0,105.4 L562.0,105.4" fill="none" stroke="#d6a65c" stroke-width="1.5" stroke-linejoin="round"/><text font-size="20" fill="#5f5a54" text-anchor="start" font-weight="400"><tspan x="76.0" y="169.8">Cloud 隨時在放棄短期營收（Pichai </tspan><tspan x="76.0" y="197.4">自述；財報未量化、未揭露配比）</tspan></text><path d="M482.0,135.8 L482.0,221.8" fill="none" stroke="#5f5a54" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b33" x="62.0" y="223.8" width="470.0" height="152.6" fill="#f3f1ec" stroke="#5f5a54" stroke-width="1.8" rx="14"/><text font-size="22" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b33"><tspan x="80.0" y="261.6">各事業依長遠計畫規劃</tspan></text><rect id="b34" x="80.0" y="280.4" width="270.0" height="78.0" fill="#ddefe3" stroke="#7cb394" stroke-width="1.8" rx="12"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b34 b33"><tspan x="94.0" y="312.4">Cloud（預測、需求訊號、</tspan><tspan x="94.0" y="340.0">已簽約合約）</tspan></text><rect id="b35" x="366.0" y="280.4" width="148.0" height="78.0" fill="#e6e9ee" stroke="#9eaab7" stroke-width="1.8" rx="12"/><text font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="400" data-box="b35 b33"><tspan x="440.0" y="326.2">其他事業</tspan></text><path d="M62.0,105.4 L40.0,105.4 L40.0,319.4 L78.0,319.4" fill="none" stroke="#5f5a54" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect id="b36" x="562.0" y="223.8" width="308.0" height="109.6" fill="#e9e2f4" stroke="#a08cc8" stroke-width="1.8" rx="12" stroke-dasharray="6 5"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b36"><tspan x="578.0" y="257.8">供給不夠時：去年向外租用短</tspan><tspan x="578.0" y="285.4">期運算資源，配合部分客戶</tspan><tspan x="578.0" y="313.0">（Pichai 自述）</tspan></text><rect id="b37" x="30.0" y="398.4" width="840.0" height="82.0" fill="#e6e9ee" stroke="#9eaab7" stroke-width="1.8" rx="12"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b37"><tspan x="46.0" y="432.4">財報可查的部分：2026 年第一季 Pichai 說能滿足需求的話 Cloud 營收會更高；第二季 </tspan><tspan x="46.0" y="460.0">CFO 說仍處於供給受限環境</tspan></text></svg>