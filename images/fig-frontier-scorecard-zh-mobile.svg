<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1455" width="600" height="1455" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><!-- 字型 fallback：PingFang TC、Noto Sans TC、Microsoft JhengHei；只在 macOS Chromium 驗過版面 --><title id="t">Google 自家模型卡：Argon 與三個對手模型（Google 自報分數）</title><desc id="d">點圖：Google 在 Gemini 4 Argon 模型卡自報的五項基準分數，每項四個點，依序為 Gemini 4 Argon、GPT-6 Astra、Claude Fable 5.1、Claude Opus 5.5，橫軸 50% 到 90%，點越靠右分數越高。程式／FrontierSWE v2：Gemini 4 Argon 55.0%、GPT-6 Astra 65.5%、Claude Fable 5.1 56.3%、Claude Opus 5.5 62.3%；程式／Terminal-bench 4.0：Gemini 4 Argon 57.4%、GPT-6 Astra 58.2%、Claude Fable 5.1 57.9%、Claude Opus 5.5 66.4%；科學與數學／Terminal-Bench Science 0.1：Gemini 4 Argon 57.6%、GPT-6 Astra 68.1%、Claude Fable 5.1 52.6%、Claude Opus 5.5 63.3%；科學與數學／LABBench 2：Gemini 4 Argon 88.8%、GPT-6 Astra 85.4%、Claude Fable 5.1 68.6%、Claude Opus 5.5 73.1%；科學與數學／RiemannBench：Gemini 4 Argon 76.0%、GPT-6 Astra 72.0%、Claude Fable 5.1 65.6%、Claude Opus 5.5 69.6%。FrontierSWE v2、Terminal-bench 4.0、Terminal-Bench Science 0.1 三項 Argon 不是最高，前兩項是四款中最低；LABBench 2 與 RiemannBench 由 Argon 領先。圖下註：知識工作四項、DeepSWE v1.1、Vibe Code Bench 模型卡顯示 Argon 領先（未畫數字）；資料來源：Gemini 4 Argon 模型卡（2026-10）。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5a54"/></marker></defs><rect width="600" height="1455" fill="#f9f7f4"/><text font-size="28" fill="#2b2b2b" text-anchor="start" font-weight="700"><tspan x="24.0" y="49.2">Google 自家模型卡：Argon </tspan><tspan x="24.0" y="87.8">與三個對手模型（Google 自報分數）</tspan></text><circle cx="36.0" cy="123.9" r="9.120000000000001" fill="#3f7cc4" stroke="none" stroke-width="0"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400"><tspan x="67.6" y="131.6">Gemini 4 Argon</tspan></text><circle cx="285.8" cy="123.9" r="9.120000000000001" fill="#4b9a6f" stroke="none" stroke-width="0"/><text font-size