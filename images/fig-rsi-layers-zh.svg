<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 718" width="900" height="718" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><!-- 字型 fallback：PingFang TC、Noto Sans TC、Microsoft JhengHei；只在 macOS Chromium 驗過版面 --><title id="t">遞迴自我改進：說法與證據的分層</title><desc id="d">三層堆疊圖，由下而上證據越來越少。底層「書面紀錄（Google DeepMind 安全報告、模型卡）」：大部分生產程式碼有超過 75% 由 AI 撰寫；完全委派的 PR：4 月 7.5% → 9 月 11.9%；約 88% 的 PR 仍需人類多輪引導或親寫；能力趨勢斜率：每月 0.091 → 0.118 GCI 點，差異不顯著；結論：目前沒有顯著的端到端 AI 研發加速，風險 currently low；ML R&amp;D acceleration／automation level 1：CCL not reached。中層「Pichai 在訪談中」：離 RSI 的終極狀態還相當遙遠；RSI 迴圈與 AI 研究人員並行運作；預計明年持續進展。上層「轉述與想像」：Brin（圓桌）：starting to get onto that RSI treadmill；主持人：Argon 的核心創新之一；主持人提到的想像：智慧爆發、foom。右側箭頭由下往上，標示「說法越往上，書面證據越少」。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5a54"/></marker></defs><rect width="900" height="718" fill="#f9f7f4"/><text font-size="26" fill="#2b2b2b" text-anchor="start" font-weight="700"><tspan x="30.0" y="47.4">遞迴自我改進：說法與證據的分層</tspan></text><rect id="b25" x="30.0" y="75.1" width="680.0" height="162.7" fill="#f7dde2" stroke="#d48b9b" stroke-width="1.8" rx="14" stroke-dasharray="6 5"/><text font-size="21" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b25"><tspan x="48.0" y="112.0">轉述與想像</tspan></text><path d="M48.0,122.6 L692.0,122.6" fill="none" stroke="#d48b9b" stroke-width="1.2" stroke-linejoin="round"/><circle cx="54.0" cy="144.2" r="3.4000000000000004" fill="#d48b9b" stroke="none" stroke-width="0"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b25"><tspan x="68.0" y="150.6">Brin（圓桌）：starting to get onto that RSI treadmill</tspan></text><circle cx="54.0" cy="176.6" r="3.4000000000000004" fill="#d48b9b" stroke="none" stroke-width="0"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b25"><tspan x="68.0" y="183.0">主持人：Argon 的核心創新之一</tspan></text><circle cx="54.0" cy="209.0" r="3.4000000000000004" fill="#d48b9b" stroke="none" stroke-width="0"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b25"><tspan x="68.0" y="215.4">主持人提到的想像：智慧爆發、foom</tspan></text><rect id="b26" x="30.0" y="253.8" width="680.0" height="162.7" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.8" rx="14"/><text font-size="21" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b26"><tspan x="48.0" y="290.7">Pichai 在訪談中</tspan></text><path d="M48.0,301.4 L692.0,301.4" fill="none" stroke="#d6a65c" stroke-width="1.2" stroke-linejoin="round"/><circle cx="54.0" cy="323.0" r="3.4000000000000004" fill="#d6a65c" stroke="none" stroke-width="0"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b26"><tspan x="68.0" y="329.4">離 RSI 的終極狀態還相當遙遠</tspan></text><circle cx="54.0" cy="355.4" r="3.4000000000000004" fill="#d6a65c" stroke="none" stroke-width="0"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b26"><tspan x="68.0" y="361.8">RSI 迴圈與 AI 研究人員並行運作</tspan></text><circle cx="54.0" cy="387.8" r="3.4000000000000004" fill="#d6a65c" stroke="none" stroke-width="0"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b26"><tspan x="68.0" y="394.2">預計明年持續進展</tspan></text><rect id="b27" x="30.0" y="432.6" width="680.0" height="259.9" fill="#ddefe3" stroke="#7cb394" stroke-width="1.8" rx="14"/><text font-size="21" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b27"><tspan x="48.0" y="469.5">書面紀錄（Google DeepMind 安全報告、模型卡）</tspan></text><path d="M48.0,480.1 L692.0,480.1" fill="none" stroke="#7cb394" stroke-width="1.2" stroke-linejoin="round"/><circle cx="54.0" cy="501.7" r="3.4000000000000004" fill="#7cb394" stroke="none" stroke-width="0"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b27"><tspan x="68.0" y="508.1">大部分生產程式碼有超過 75% 由 AI 撰寫</tspan></text><circle cx="54.0" cy="534.1" r="3.4000000000000004" fill="#7cb394" stroke="none" stroke-width="0"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b27"><tspan x="68.0" y="540.5">完全委派的 PR：4 月 7.5% → 9 月 11.9%</tspan></text><circle cx="54.0" cy="566.5" r="3.4000000000000004" fill="#7cb394" stroke="none" stroke-width="0"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b27"><tspan x="68.0" y="572.9">約 88% 的 PR 仍需人類多輪引導或親寫</tspan></text><circle cx="54.0" cy="598.9" r="3.4000000000000004" fill="#7cb394" stroke="none" stroke-width="0"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b27"><tspan x="68.0" y="605.3">能力趨勢斜率：每月 0.091 → 0.118 GCI 點，差異不顯著</tspan></text><circle cx="54.0" cy="631.3" r="3.4000000000000004" fill="#7cb394" stroke="none" stroke-width="0"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b27"><tspan x="68.0" y="637.7">結論：目前沒有顯著的端到端 AI 研發加速，風險 currently low</tspan></text><circle cx="54.0" cy="663.7" r="3.4000000000000004" fill="#7cb394" stroke="none" stroke-width="0"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b27"><tspan x="68.0" y="670.1">ML R&amp;D acceleration／automation level 1：CCL not reached</tspan></text><path d="M742.0,692.5 L742.0,79.1" fill="none" stroke="#5f5a54" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/><text font-size="20" fill="#5f5a54" text-anchor="start" font-weight="700"><tspan x="758.0" y="376.8">說法越往上，</tspan><tspan x="758.0" y="404.4">書面證據越少</tspan></text></svg>