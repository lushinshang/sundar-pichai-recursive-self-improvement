<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><!-- 字型 fallback：PingFang TC、Noto Sans TC、Microsoft JhengHei；只在 macOS Chromium 驗過版面 --><title id="t">Pichai 描述的常駐 agent：三層加脈絡</title><desc id="d">左側是四層堆疊，由下而上：模型（Argon）、harness、執行環境（runtime）、你的脈絡；外框標「無介面服務（headless service），在雲端全天候運行」。右側依發布狀態分三組：「已發表」：企業版 Gemini agent（2026-10-08）、Agent Compute Engine：每個 agent 一個 microVM（2026-10-22）、Gemini Spark（2026-05-19）；「Pichai 自述」：Pro、Ultra 使用者在 Gemini app 已看到對話與任務、每個查詢啟動一個 micro VM、agentic 任務比例穩定成長（未公布數字）；「計畫」：把統一 agent 帶給消費者、個人 agent 跨 Gemini app、Google 搜尋、Gmail，由 Argon 驅動。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5a54"/></marker></defs><rect width="900" height="770" fill="#f9f7f4"/><text font-size="26" fill="#2b2b2b" text-anchor="start" font-weight="700"><tspan x="30.0" y="47.4">Pichai 描述的常駐 agent：三層加脈絡</tspan></text><rect id="b75" x="30.0" y="75.1" width="320.0" height="668.8" fill="#f1eee8" stroke="#5f5a54" stroke-width="1.8" rx="16" stroke-dasharray="7 5"/><text font-size="20" fill="#5f5a54" text-anchor="start" font-weight="700" data-box="b75"><tspan x="48.0" y="109.1">無介面服務（headless </tspan><tspan x="48.0" y="136.7">service），在雲端全天候運行</tspan></text><rect id="b76" x="48.0" y="257.5" width="284.0" height="84.0" fill="#f7dde2" stroke="#d48b9b" stroke-width="1.8" rx="12"/><text font-size="22" fill="#2b2b2b" text-anchor="middle" font-weight="700" data-box="b76 b75"><tspan x="190.0" y="307.0">你的脈絡</tspan></text><rect id="b77" x="48.0" y="351.5" width="284.0" height="84.0" fill="#dce8f6" stroke="#7fa3cf" stroke-width="1.8" rx="12"/><text font-size="22" fill="#2b2b2b" text-anchor="middle" font-weight="700" data-box="b77 b75"><tspan x="190.0" y="401.0">執行環境（runtime）</tspan></text><rect id="b78" x="48.0" y="445.5" width="284.0" height="84.0" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.8" rx="12"/><text font-size="22" fill="#2b2b2b" text-anchor="middle" font-weight="700" data-box="b78 b75"><tspan x="190.0" y="495.0">harness</tspan></text><rect id="b79" x="48.0" y="539.5" width="284.0" height="84.0" fill="#ddefe3" stroke="#7cb394" stroke-width="1.8" rx="12"/><text font-size="22" fill="#2b2b2b" text-anchor="middle" font-weight="700" data-box="b79 b75"><tspan x="190.0" y="589.0">模型（Argon）</tspan></text><rect id="b59" x="380.0" y="75.1" width="82.0" height="33.6" fill="#ddefe3" stroke="#7cb394" stroke-width="1.5" rx="16.8"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b59"><tspan x="391.0" y="98.7">已發表</tspan></text><rect id="b60" x="380.0" y="118.7" width="490.0" height="46.4" fill="#fffdf9" stroke="#7cb394" stroke-width="1.8" rx="10"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b60"><tspan x="392.0" y="148.7">企業版 Gemini agent（2026-10-08）</tspan></text><rect id="b61" x="380.0" y="173.1" width="490.0" height="74.0" fill="#fffdf9" stroke="#7cb394" stroke-width="1.8" rx="10"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b61"><tspan x="392.0" y="203.1">Agent Compute Engine：每個 agent 一個 </tspan><tspan x="392.0" y="230.7">microVM（2026-10-22）</tspan></text><rect id="b62" x="380.0" y="255.1" width="490.0" height="46.4" fill="#fffdf9" stroke="#7cb394" stroke-width="1.8" rx="10"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b62"><tspan x="392.0" y="285.1">Gemini Spark（2026-05-19）</tspan></text><rect id="b63" x="380.0" y="323.5" width="137.4" height="33.6" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.5" rx="16.8"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b63"><tspan x="391.0" y="347.1">Pichai 自述</tspan></text><rect id="b64" x="380.0" y="367.1" width="490.0" height="74.0" fill="#fffdf9" stroke="#d6a65c" stroke-width="1.8" rx="10"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b64"><tspan x="392.0" y="397.1">Pro、Ultra 使用者在 Gemini app </tspan><tspan x="392.0" y="424.7">已看到對話與任務</tspan></text><rect id="b65" x="380.0" y="449.1" width="490.0" height="46.4" fill="#fffdf9" stroke="#d6a65c" stroke-width="1.8" rx="10"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b65"><tspan x="392.0" y="479.1">每個查詢啟動一個 micro VM</tspan></text><rect id="b66" x="380.0" y="503.5" width="490.0" height="46.4" fill="#fffdf9" stroke="#d6a65c" stroke-width="1.8" rx="10"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b66"><tspan x="392.0" y="533.5">agentic 任務比例穩定成長（未公布數字）</tspan></text><rect id="b67" x="380.0" y="571.9" width="62.0" height="33.6" fill="#e9e2f4" stroke="#a08cc8" stroke-width="1.5" rx="16.8"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b67"><tspan x="391.0" y="595.5">計畫</tspan></text><rect id="b68" x="380.0" y="615.5" width="490.0" height="46.4" fill="#fffdf9" stroke="#a08cc8" stroke-width="1.8" rx="10"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b68"><tspan x="392.0" y="645.5">把統一 agent 帶給消費者</tspan></text><rect id="b69" x="380.0" y="669.9" width="490.0" height="74.0" fill="#fffdf9" stroke="#a08cc8" stroke-width="1.8" rx="10"/><text font-size="20" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b69"><tspan x="392.0" y="699.9">個人 agent 跨 Gemini app、Google 搜尋、</tspan><tspan x="392.0" y="727.5">Gmail，由 Argon 驅動</tspan></text></svg>