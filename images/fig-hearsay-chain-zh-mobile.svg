<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 983" width="600" height="983" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><!-- 字型 fallback：PingFang TC、Noto Sans TC、Microsoft JhengHei；只在 macOS Chromium 驗過版面 --><title id="t">一句話經過幾手：AWS 運算資源『賣到 2028』</title><desc id="d">由左到右的傳話鏈，共四個節點：「Andy Jassy（私下對話）」 → 「Ben Horowitz 在 All-In 節目轉述：beyond 2028」 → 「主持人在本訪談轉述：運算資源到 2028 年前都賣光了（18:57）」 → 「Pichai 回應：這很合理；客戶如果今天才來要 2027 年的運算資源，很難接；去年也向外租了短期運算資源（19:07–19:31）」。前兩個節點標「單方說法」。下方對照框標「已確認」：「Jassy 本人公開說法（a16z 節目，2026-10-23 美國時間，Reuters 報導）：2027 年 largely sold out，保留一部分給 on-demand、Bedrock、EC2；2028 年 a good chunk 已售出」。時間標註：「Pichai 的訪談早於 Jassy 這次公開發言」。對照框以虛線連回第一個節點（同一人 Jassy）。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5a54"/></marker></defs><rect width="600" height="983" fill="#f9f7f4"/><text font-size="28" fill="#2b2b2b" text-anchor="start" font-weight="700"><tspan x="24.0" y="49.2">一句話經過幾手：AWS 運算資源『賣到 </tspan><tspan x="24.0" y="87.8">2028』</tspan></text><rect id="b52" x="72.0" y="114.0" width="122.4" height="40.3" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.5" rx="20.160000000000004"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b52"><tspan x="85.2" y="142.3">單方說法</tspan></text><rect id="b53" x="72.0" y="166.3" width="504.0" height="58.9" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.8" rx="12"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b53"><tspan x="88.0" y="203.9">Andy Jassy（私下對話）</tspan></text><path d="M324.0,227.2 L324.0,259.2" fill="none" stroke="#5f5a54" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b54" x="72.0" y="263.2" width="504.0" height="92.0" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.8" rx="12"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b54"><tspan x="88.0" y="300.8">Ben Horowitz 在 All-In 節目轉述：</tspan><tspan x="88.0" y="333.9">beyond 2028</tspan></text><path d="M324.0,357.2 L324.0,389.2" fill="none" stroke="#5f5a54" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b55" x="72.0" y="393.2" width="504.0" height="92.0" fill="#f7dde2" stroke="#d48b9b" stroke-width="1.8" rx="12"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b55"><tspan x="88.0" y="430.8">主持人在本訪談轉述：運算資源到 2028 </tspan><tspan x="88.0" y="463.9">年前都賣光了（18:57）</tspan></text><path d="M324.0,487.2 L324.0,519.2" fill="none" stroke="#5f5a54" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b56" x="72.0" y="523.2" width="504.0" height="158.2" fill="#dce8f6" stroke="#7fa3cf" stroke-width="1.8" rx="12"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b56"><tspan x="88.0" y="560.8">Pichai 回應：這很合理；客戶如果今天才</tspan><tspan x="88.0" y="593.9">來要 2027 年的運算資源，很難接；</tspan><tspan x="88.0" y="627.0">去年也向外租了短期運算資源</tspan><tspan x="88.0" y="660.2">（19:07–19:31）</tspan></text><path d="M62.0,172.3 L48.0,172.3 L48.0,349.2 L62.0,349.2" fill="none" stroke="#d6a65c" stroke-width="2.5" stroke-linejoin="round"/><text font-size="24" fill="#5f5a54" text-anchor="start" font-weight="700"><tspan x="24.0" y="723.0">Pichai 的訪談早於 Jassy 這次公開發言</tspan></text><rect id="b57" x="24.0" y="746.3" width="552.0" height="212.6" fill="#ddefe3" stroke="#7cb394" stroke-width="1.8" rx="14"/><rect id="b58" x="40.0" y="762.3" width="98.4" height="40.3" fill="#c9e6d3" stroke="#7cb394" stroke-width="1.5" rx="20.160000000000004"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b58 b57"><tspan x="53.2" y="790.6">已確認</tspan></text><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b57"><tspan x="40.0" y="836.2">Jassy 本人公開說法（a16z 節目，2026-10-23 </tspan><tspan x="40.0" y="869.4"