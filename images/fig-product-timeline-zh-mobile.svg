<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1987" width="600" height="1987" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><!-- 字型 fallback：PingFang TC、Noto Sans TC、Microsoft JhengHei；只在 macOS Chromium 驗過版面 --><title id="t">訪談提到的產品與事件（截至 2026-10-24）</title><desc id="d">橫向時間軸，2025-10 到 2026-10，每列一個事件，點的位置依日期比例排列；手機版改為由上而下的清單。事件依序：2025-12 媒體報導 OpenAI 內部宣布 code red，標籤：已確認；2026-01-12 Google 與 Apple 聯合聲明：下一代 Apple Foundation Models 以 Gemini 為基礎，標籤：已確認；2026-04-06 Anthropic 與 Google、Broadcom 簽多 GW 新一代 TPU（2027 年起上線），標籤：已確認；2026-04-24 Bloomberg 報導 Google 將投資 Anthropic 最多 400 億美元，標籤：單方說法；2026-05-19 I/O 2026 發表 Gemini Spark，標籤：已確認；2026-07 Hugging Face 事件，標籤：已確認；2026-09-08 Meta 推出 Muse，標籤：已確認；2026-09-14 Apple Siri AI 以英文 beta 開始推出，標籤：已確認；2026-09-29 OpenAI 推出 dots，標籤：單方說法；2026-09-30 Google 公布 Gemini 4 Argon（先給 Fairwind 資安防禦方），標籤：已確認；2026-10-01 Project Suncatcher 原型衛星入軌，標籤：已確認；2026-10-08 Gemini at Work 2026 發表 Gemini agent，標籤：已確認；2026-10-13 Argon 全球分層開放，標籤：已確認；2026-10-20 本訪談上架，無標籤；2026-10-22 Agent Compute Engine 發表，標籤：已確認；2026-10-23 Jassy 公開說 2027 大致售罄，標籤：已確認；2026-10-28 Alphabet 第三季財報預計公布（依 Alphabet 公告），標籤：當事方自揭。標籤顏色：綠色＝已確認，橘色＝單方說法，紫色＝當事方自揭；本訪談上架那一列以淡黃底標示。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5a54"/></marker></defs><rect width="600" height="1987" fill="#f9f7f4"/><text font-size="28" fill="#2b2b2b" text-anchor="start" font-weight="700"><tspan x="24.0" y="49.2">訪談提到的產品與事件（截至 </tspan><tspan x="24.0" y="87.8">2026-10-24）</tspan></text><rect x="24.0" y="111.0" width="33.6" height="24.0" fill="#ddefe3" stroke="#7cb394" stroke-width="1.5" rx="4"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400"><tspan x="67.6" y="131.6">已確認</tspan></text><rect x="163.6" y="111.0" width="33.6" height="24.0" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.5" rx="4"/><text font-siz