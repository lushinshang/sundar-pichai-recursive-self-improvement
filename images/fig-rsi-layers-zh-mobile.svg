<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1058" width="600" height="1058" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><!-- 字型 fallback：PingFang TC、Noto Sans TC、Microsoft JhengHei；只在 macOS Chromium 驗過版面 --><title id="t">遞迴自我改進：說法與證據的分層</title><desc id="d">三層堆疊圖，由下而上證據越來越少。底層「書面紀錄（Google DeepMind 安全報告、模型卡）」：大部分生產程式碼有超過 75% 由 AI 撰寫；完全委派的 PR：4 月 7.5% → 9 月 11.9%；約 88% 的 PR 仍需人類多輪引導或親寫；能力趨勢斜率：每月 0.091 → 0.118 GCI 點，差異不顯著；結論：目前沒有顯著的端到端 AI 研發加速，風險 currently low；ML R&amp;D acceleration／automation level 1：CCL not reached。中層「Pichai 在訪談中」：離 RSI 的終極狀態還相當遙遠；RSI 迴圈與 AI 研究人員並行運作；預計明年持續進展。上層「轉述與想像」：Brin（圓桌）：starting to get onto that RSI treadmill；主持人：Argon 的核心創新之一；主持人提到的想像：智慧爆發、foom。右側箭頭由下往上，標示「說法越往上，書面證據越少」。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5a54"/></marker></defs><rect width="600" height="1058" fill="#f9f7f4"/><text font-size="28" fill="#2b2b2b" text-anchor="start" font-weight="700"><tspan x="24.0" y="49.2">遞迴自我改進：說法與證據的分層</tspan></text><text font-size="24" fill="#5f5a54" text-anchor="start" font-weight="700"><tspan x="24.0" y="95.0">說法越往上，書面證據越少</tspan></text><rect id="b28" x="74.0" y="114.2" width="502.0" height="213.8" fill="#f7dde2" stroke="#d48b9b" stroke-width="1.8" rx="14" stroke-dasharray="6 5"/><text font-size="25" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b28"><tspan x="92.0" y="154.7">轉述與想像</tspan></text><path d="M92.0,166.2 L558.0,166.2" fill="none" stroke="#d48b9b" stroke-width="1.2" stroke-linejoin="round"/><circle cx="99.2" cy="190.2" r="4.08" fill="#d48b9b" stroke="none" stroke-width="0"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b28"><tspan x="116.0" y="197.8">Brin（圓桌）：starting to get onto </tspan><tspan x="116.0" y="231.0">that RSI treadmill</tspan></text><circle cx="99.2" cy="260.2" r="4.08" fill="#d48b9b" stroke="none" stroke-width="0"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b28"><tspan x="116.0" y="267.8">主持人：Argon 的核心創新之一</tspan></text><circle cx="99.2" cy="297.0" r="4.08" fill="#d48b9b" stroke="none" stroke-width="0"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b28"><tspan x="116.0" y="304.7">主持人提到的想像：智慧爆發、foom</tspan></text><rect id="b29" x="74.0" y="344.0" width="502.0" height="180.6" fill="#fbecd2" stroke="#d6a65c" stroke-width="1.8" rx="14"/><text font-size="25" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b29"><tspan x="92.0" y="384.5">Pichai 在訪談中</tspan></text><path d="M92.0,396.0 L558.0,396.0" fill="none" stroke="#d6a65c" stroke-width="1.2" stroke-linejoin="round"/><circle cx="99.2" cy="419.9" r="4.08" fill="#d6a65c" stroke="none" stroke-width="0"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b29"><tspan x="116.0" y="427.6">離 RSI 的終極狀態還相當遙遠</tspan></text><circle cx="99.2" cy="456.8" r="4.08" fill="#d6a65c" stroke="none" stroke-width="0"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b29"><tspan x="116.0" y="464.5">RSI 迴圈與 AI 研究人員並行運作</tspan></text><circle cx="99.2" cy="493.7" r="4.08" fill="#d6a65c" stroke="none" stroke-width="0"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b29"><tspan x="116.0" y="501.4">預計明年持續進展</tspan></text><rect id="b30" x="74.0" y="540.6" width="502.0" height="491.4" fill="#ddefe3" stroke="#7cb394" stroke-width="1.8" rx="14"/><text font-size="25" fill="#2b2b2b" text-anchor="start" font-weight="700" data-box="b30"><tspan x="92.0" y="581.1">書面紀錄（Google DeepMind </tspan><tspan x="92.0" y="615.6">安全報告、模型卡）</tspan></text><path d="M92.0,627.1 L558.0,627.1" fill="none" stroke="#7cb394" stroke-width="1.2" stroke-linejoin="round"/><circle cx="99.2" cy="651.1" r="4.08" fill="#7cb394" stroke="none" stroke-width="0"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b30"><tspan x="116.0" y="658.7">大部分生產程式碼有超過 75% 由 AI </tspan><tspan x="116.0" y="691.9">撰寫</tspan></text><circle cx="99.2" cy="721.1" r="4.08" fill="#7cb394" stroke="none" stroke-width="0"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b30"><tspan x="116.0" y="728.7">完全委派的 PR：4 月 7.5% → 9 月 </tspan><tspan x="116.0" y="761.9">11.9%</tspan></text><circle cx="99.2" cy="791.1" r="4.08" fill="#7cb394" stroke="none" stroke-width="0"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b30"><tspan x="116.0" y="798.7">約 88% 的 PR 仍需人類多輪引導或親寫</tspan></text><circle cx="99.2" cy="827.9" r="4.08" fill="#7cb394" stroke="none" stroke-width="0"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b30"><tspan x="116.0" y="835.6">能力趨勢斜率：每月 0.091 → 0.118 </tspan><tspan x="116.0" y="868.7">GCI 點，差異不顯著</tspan></text><circle cx="99.2" cy="897.9" r="4.08" fill="#7cb394" stroke="none" stroke-width="0"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b30"><tspan x="116.0" y="905.6">結論：目前沒有顯著的端到端 AI </tspan><tspan x="116.0" y="938.7">研發加速，風險 currently low</tspan></text><circle cx="99.2" cy="967.9" r="4.08" fill="#7cb394" stroke="none" stroke-width="0"/><text font-size="24" fill="#2b2b2b" text-anchor="start" font-weight="400" data-box="b30"><tspan x="116.0" y="975.6">ML R&amp;D acceleration／automation </tspan><tspan x="116.0" y="1008.7">level 1：CCL not reached</tspan></text><path d="M42.0,1032.0 L42.0,118.2" fill="none" stroke="#5f5a54" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/></svg>